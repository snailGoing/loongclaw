<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoongClaw · 熊大</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 12px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .status {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: #0f3460;
    }
    .status.connected { background: #0d7377; color: #e8ffc1; }
    .status.disconnected { background: #e94560; color: #fff; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #0f3460;
      color: #eaeaea;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
    }
    .msg.assistant .md { white-space: normal; }
    .msg.assistant .md p { margin: 0.5em 0; }
    .msg.assistant .md pre { background: #0f0f1a; padding: 10px; border-radius: 8px; overflow-x: auto; }
    .msg.assistant .md code { background: #0f0f1a; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    .msg .error { color: #e94560; }
    .input-area {
      padding: 16px 20px;
      background: #16213e;
      border-top: 1px solid #0f3460;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 10px 14px;
      border: 1px solid #0f3460;
      border-radius: 10px;
      background: #1a1a2e;
      color: #eaeaea;
      font-size: 1rem;
      resize: none;
      font-family: inherit;
    }
    #input:focus { outline: none; border-color: #e94560; }
    #send {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #e94560;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
    #send:hover { background: #ff6b6b; }
    #send:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🐉 LoongClaw · 熊大</h1>
    <span id="status" class="status disconnected">未连接</span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="输入消息，按 Enter 发送..." rows="1"></textarea>
      <button id="send" type="button">发送</button>
    </div>
  </div>

  <script>
    (function () {
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('input');
      const sendBtn = document.getElementById('send');
      const statusEl = document.getElementById('status');

      let ws = null;
      let wsPort = 3001;
      let currentAssistantEl = null;
      let streamBuffer = '';

      function setStatus(connected) {
        statusEl.textContent = connected ? '已连接' : '未连接';
        statusEl.className = 'status ' + (connected ? 'connected' : 'disconnected');
        sendBtn.disabled = !connected;
      }

      function renderMd(text) {
        if (typeof marked !== 'undefined' && text) {
          try { return marked.parse(text); } catch (_) {}
        }
        return (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
      }

      function addMessage(role, content, isMarkdown) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        if (isMarkdown && role === 'assistant') {
          const md = document.createElement('div');
          md.className = 'md';
          md.innerHTML = renderMd(content || '');
          div.appendChild(md);
        } else {
          div.textContent = content || '';
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      function appendToAssistant(content) {
        if (!currentAssistantEl) {
          currentAssistantEl = document.createElement('div');
          currentAssistantEl.className = 'msg assistant';
          const md = document.createElement('div');
          md.className = 'md';
          currentAssistantEl.appendChild(md);
          currentAssistantEl._mdEl = md;
          messagesEl.appendChild(currentAssistantEl);
        }
        currentAssistantEl._mdEl.innerHTML = renderMd(content || '');
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = location.hostname;
        const url = protocol + '//' + host + ':' + wsPort;
        ws = new WebSocket(url);

        ws.onopen = function () { setStatus(true); };
        ws.onclose = function () { setStatus(false); };
        ws.onerror = function () { setStatus(false); };

        ws.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            switch (data.type) {
              case 'connected':
                break;
              case 'message':
                if (data.role === 'user') { /* 用户消息已在 send() 中立即展示 */ }
                break;
              case 'message_chunk':
                streamBuffer += data.content || '';
                appendToAssistant(streamBuffer);
                break;
              case 'message_complete':
                if (data.content) streamBuffer = data.content;
                appendToAssistant(streamBuffer);
                streamBuffer = '';
                currentAssistantEl = null;
                break;
              case 'error':
                addMessage('assistant', '错误: ' + data.error, false).classList.add('error');
                streamBuffer = '';
                currentAssistantEl = null;
                break;
            }
          } catch (err) {
            addMessage('assistant', '解析消息失败', false).classList.add('error');
          }
        };
      }

      function send() {
        var text = (inputEl.value || '').trim();
        if (!text) {
          inputEl.focus();
          return;
        }
        inputEl.value = '';
        inputEl.focus();

        if (!ws || ws.readyState !== WebSocket.OPEN) {
          addMessage('assistant', '未连接，请检查网络或点击「重试」', false).classList.add('error');
          return;
        }
        addMessage('user', text, false);
        currentAssistantEl = null;
        streamBuffer = '';
        ws.send(JSON.stringify({ type: 'chat', data: { message: text } }));
      }

      function retryConnect() {
        if (ws) {
          try { ws.close(); } catch (_) {}
          ws = null;
        }
        setStatus(false);
        connect();
      }

      sendBtn.addEventListener('click', function () { send(); });
      inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      statusEl.style.cursor = 'pointer';
      statusEl.title = '点击重连';
      statusEl.addEventListener('click', function () {
        if (statusEl.classList.contains('disconnected')) retryConnect();
      });

      addMessage('assistant', '你好，我是熊大。输入消息后点击发送或按 Enter 与我对话。', false);

      (async function init() {
        try {
          var res = await fetch(location.origin + '/api/config');
          var cfg = await res.json();
          if (cfg && cfg.wsPort) wsPort = cfg.wsPort;
        } catch (_) {}
        connect();
      })();
    })();
  </script>
</body>
</html>
